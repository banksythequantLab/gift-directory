<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — gift.directory</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Gift shirts made to order and shipped by Printful, paid with PayPal.">
<link rel="stylesheet" href="/style.css"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
.wrap{max-width:1100px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.prod{cursor:pointer}.prod img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:10px}.prod .t{font-weight:600;margin:8px 0 2px}
.note{background:#fff7e0;border:1px solid #f0d58a;border-radius:10px;padding:10px 14px;margin:10px 0}
.buy{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:760px){.buy{grid-template-columns:1fr}}
.buy img{width:100%;border-radius:12px;background:#fff}
.pv{border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}.pv img{width:100%;height:100%;object-fit:contain;background:none;border-radius:0}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:.9rem}input,select,textarea{width:100%;box-sizing:border-box}
.row2{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.sum{margin:12px 0;line-height:1.7}.err{color:#b42318;margin:8px 0}
.pp{background:#ffc439;color:#111;border:0;border-radius:24px;padding:12px 20px;font-weight:700;width:100%;cursor:pointer;font-size:1rem}
.pp[disabled]{opacity:.5;cursor:default}
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.stage svg{display:block;width:100%;height:auto}
.stage .on{position:absolute;overflow:hidden}.stage .on img{display:block;height:auto;border-radius:0;background:none;transition:opacity .15s}
</style></head>
<body><div class="wrap">
<header class="top"><h1><a href="/" style="color:inherit;text-decoration:none">gift.directory</a></h1><span class="tag">Shop</span></header>
<main id="main">
<div id="banner"></div>
<div id="app"><p class="muted">Loading…</p></div>
</main>
<footer>Made to order and shipped by our print partner Printful. Paid securely with PayPal. US shipping only for now.
<div style="margin-top:6px"><a href="/gifts">Gift guides</a> · <a href="/about">About</a> · <a href="/contact">Contact</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></div></footer>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = c => "$" + (c / 100).toFixed(2);
const STATES = "AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY".split(" ");
const q = new URLSearchParams(location.search);
let products = [], live = false;
const api = async (path, opt = {}) => {
  const r = await fetch("/api/shop" + path, { ...opt, headers: { "content-type": "application/json" } });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Something went wrong"); return j;
};
function banner() {
  $("#banner").innerHTML = live ? "" : `<div class="note"><b>Test mode.</b> Payments use the PayPal sandbox and orders are not printed or shipped.</div>`;
}
async function start() {
  try { const j = await api("/products"); products = j.products || []; live = !!j.live; }
  catch (e) { $("#app").innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  banner();
  if (q.get("order")) return thanks(q.get("order"));
  if (q.get("p")) { const p = products.find(x => String(x.id) === q.get("p")); if (p) return detail(p); }
  list(q.get("cancelled") ? `<div class="note">Payment cancelled. Nothing was charged.</div>` : "");
}
function list(top = "") {
  $("#app").innerHTML = top + `<h2>Made to order, personalized</h2><p class="muted">Shirts, hoodies and mugs with their name on it. Printed and shipped for you by Printful.</p>` +
    (products.length ? `<div class="grid">${products.map(p => `<div class="card prod" data-p="${p.id}">
      ${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : ""}<div class="t">${esc(p.title)}</div>
      <div class="muted">${p.kind === "photo" ? "Your photo on it. " : p.kind === "tpl" ? "Personalize it. " : ""}From ${money(p.price_cents)}</div></div>`).join("")}</div>` : `<p class="muted">Nothing for sale right now.</p>`);
  document.querySelectorAll("[data-p]").forEach(el => el.onclick = () => {
    history.pushState(null, "", "?p=" + el.dataset.p); detail(products.find(x => String(x.id) === el.dataset.p));
  });
}
window.onpopstate = () => { const p = new URLSearchParams(location.search).get("p"); const x = p && products.find(y => String(y.id) === p); x ? detail(x) : list(); };

// The product drawn in its own color with the live print placed on it, so the buyer sees their words on the thing itself.
// at: where the print sits, in percent of the drawing (left, top, width); half: show one side of a wrap-around print.
const STAGE = {
  tee: { name: "tee", vb: "0 0 300 320", at: [34, 28, 32], draw: bg => `<path fill="${bg}" d="M100 18 Q150 54 200 18 L286 60 L258 120 L228 102 L228 300 L72 300 L72 102 L42 120 L14 60 Z"/><path d="M100 18 Q150 54 200 18" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="3"/>` },
  hoodie: { name: "hoodie", vb: "0 0 300 320", at: [35, 31, 30], draw: bg => `<ellipse fill="${bg}" cx="150" cy="36" rx="48" ry="32"/><path fill="${bg}" d="M104 42 L196 42 L270 78 L252 300 L218 298 L212 150 L212 306 L88 306 L88 150 L82 298 L48 300 L30 78 Z"/><path d="M116 44 Q150 84 184 44" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="3"/><path d="M112 252 L188 252 L198 304 L102 304 Z" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="2"/>` },
  mug: { name: "mug", vb: "0 0 300 240", at: [22, 30, 46], half: true, draw: bg => `<path d="M210 72 H236 Q262 72 262 102 V140 Q262 170 236 170 H210" fill="none" stroke="#cfd4dc" stroke-width="16"/><path d="M210 72 H236 Q262 72 262 102 V140 Q262 170 236 170 H210" fill="none" stroke="${bg}" stroke-width="11"/><path fill="${bg}" stroke="#cfd4dc" stroke-width="2" d="M60 30 H210 V200 Q210 214 196 214 H74 Q60 214 60 200 Z"/>` },
};
const stageHtml = (p, st) => `<div class="stage"><svg viewBox="${st.vb}" role="img" aria-label="${esc(p.title)} with your text">${st.draw(p.print.bg)}</svg>` +
  `<div class="on" style="left:${st.at[0]}%;top:${st.at[1]}%;width:${st.at[2]}%;aspect-ratio:${st.half ? p.print.w / 2 : p.print.w}/${p.print.h}"><img id="pvimg" alt="Your text as it will print" style="width:${st.half ? 200 : 100}%"></div></div>`;
function detail(p) {
  const colors = [...new Set(p.variants.map(v => v.color))];
  const photo = p.kind === "photo", text = p.kind === "tpl" || photo, wrap = p.ptype === "mug", light = text && /^#(f|e)/i.test(p.print.bg);
  let photoId = null;
  const st = text && !photo ? STAGE[p.ptype] : null;
  const pre = new URLSearchParams(location.search), fromLink = pre.get("p") === String(p.id);
  let tpl = text ? ((p.tpls || []).includes(fromLink && pre.get("t")) ? pre.get("t") : p.tpl) : null;
  const fieldsOf = () => ((p.designs || []).find(d => d.tpl === tpl) || { fields: p.fields }).fields;
  const exOf = () => p.example && p.example.tpl === tpl ? p.example.vals : null;
  $("#app").innerHTML = `<p><a href="/shop" id="back">← All products</a></p><div class="buy">
  <div>${photo ? `<div class="pv" style="background:${p.print.bg};aspect-ratio:${p.print.w}/${p.print.h};align-items:flex-start"><img id="phimg" alt="Your photo" style="width:92%;height:auto;margin-top:6%;display:none"><span id="phph" class="muted" style="margin:auto;color:#aaa">Your photo goes here</span></div>
    <p class="muted small">Front: your photo, printed up to 11 × 14 in.</p><div id="backpv" style="display:none">` : ""}${text ? `${st ? stageHtml(p, st) : `<div class="pv" style="background:${p.print.bg};aspect-ratio:${p.print.w}/${p.print.h}${light ? ";border:1px solid var(--line)" : ""}"><img id="pvimg" alt="Preview of your design"></div>`}
    <p class="muted small">${photo ? "Back: your text." : `${st ? `Your words on the ${st.name}. It updates as you type` : "Your design as it will print. It updates as you type"}${wrap ? " (printed on both sides)" : ""}.`}</p>` : ""}${photo ? "</div>" : ""}
    ${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title)}" style="${text ? "margin-top:10px" : ""}">${text ? `<p class="muted small">Photo of a finished one, shown with sample text.</p>` : ""}` : ""}</div>
  <div><h2 style="margin-top:0">${esc(p.title)}</h2>${p.subtitle ? `<p class="muted">${esc(p.subtitle)}</p>` : ""}
    ${colors.length > 1 ? `<label for="color">Color</label><select id="color">${colors.map(c => `<option>${esc(c)}</option>`).join("")}</select>` : ""}
    <label for="size">Size</label><select id="size"></select>
    <label for="qty">Quantity</label><input id="qty" type="number" min="1" max="10" value="1">
    ${text && p.designs && p.designs.length > 1 ? `<label for="dz">Design</label><select id="dz">${p.designs.map(d => `<option value="${d.tpl}"${d.tpl === tpl ? " selected" : ""}>${esc(d.name)}</option>`).join("")}</select>` : ""}
    ${photo ? `<label for="ph">Your photo (JPEG, PNG or a phone photo)</label><input id="ph" type="file" accept="image/*"><div id="phmsg" class="muted small"></div>` : ""}
    ${text ? `<div id="fields"></div>` : ""}
    <label for="gm">Gift message (optional, printed on the packing slip)</label><textarea id="gm" maxlength="200" rows="2"></textarea>
    <h3>Ship to</h3>
    <label for="rn">Name</label><input id="rn" autocomplete="name">
    <label for="ra">Street address</label><input id="ra" autocomplete="address-line1">
    <label for="rb">Apt, suite (optional)</label><input id="rb" autocomplete="address-line2">
    <div class="row2"><div><label for="rc">City</label><input id="rc" autocomplete="address-level2"></div>
      <div><label for="rs">State</label><select id="rs" autocomplete="address-level1"><option value=""></option>${STATES.map(s => `<option>${s}</option>`).join("")}</select></div>
      <div><label for="rz">ZIP</label><input id="rz" inputmode="numeric" autocomplete="postal-code"></div></div>
    <label for="re">Your email (for the receipt)</label><input id="re" type="email" autocomplete="email">
    <div class="sum" id="sum"></div><div class="err" id="err"></div>
    <button class="pp" id="pay">Pay with PayPal</button>
    <p class="muted small">Sales tax is added where we collect it (New Jersey). Made to order: allow a few days to print, then shipping time.</p>
  </div></div>`;
  $("#back").onclick = e => { e.preventDefault(); history.pushState(null, "", "/shop"); list(); };
  const sizes = () => { const c = $("#color") ? $("#color").value : colors[0];
    $("#size").innerHTML = p.variants.filter(v => v.color === c).map(v => `<option value="${v.id}">${esc(v.size || "One size")}${v.price_cents !== p.price_cents ? " — " + money(v.price_cents) : ""}</option>`).join(""); };
  if ($("#color")) $("#color").onchange = () => { sizes(); quote(); };
  sizes();
  const vals = () => fieldsOf().map((_, i) => $("#f" + i).value);
  // The preview is the real print file, rendered small by the server. Untouched, it shows the product's example;
  // otherwise empty required fields show their placeholder.
  let pt = null; const prev = () => { clearTimeout(pt); pt = setTimeout(() => {
    const vs = vals(), ex = exOf(), q = new URLSearchParams([["t", tpl]]);
    if (photo) { const ls = vs.map(v => v.trim()).filter(Boolean); $("#backpv").style.display = ls.length ? "" : "none"; if (!ls.length) return;
      [ls[0], ls[1] || ""].forEach(v => q.append("f", v)); $("#pvimg").src = `/api/shop/preview/${p.id}.png?${q}`; return; }
    const show = !vs.some(v => v.trim()) && ex ? ex : vs.map((v, i) => v.trim() || (fieldsOf()[i].req ? (ex && ex[i]) || fieldsOf()[i].ph : ""));
    show.forEach(v => q.append("f", v));
    $("#pvimg").style.opacity = ".45"; $("#pvimg").onload = () => { $("#pvimg").style.opacity = "1"; }; $("#pvimg").src = `/api/shop/preview/${p.id}.png?${q}`; }, 180); };
  const renderFields = (vs = []) => { const ex = exOf();
    $("#fields").innerHTML = fieldsOf().map((f, i) => `<label for="f${i}">${esc(f.label)}</label><input id="f${i}" maxlength="${f.max}" placeholder="${esc((ex && ex[i]) || f.ph)}" value="${esc((vs[i] || "").slice(0, f.max))}">`).join("");
    fieldsOf().forEach((_, i) => $("#f" + i).addEventListener("input", prev)); prev(); };
  // The photo is resized in the browser (phone photos come out the right way up), then stored for 30 days.
  if (photo) $("#ph").onchange = async () => {
    const f = $("#ph").files[0]; if (!f) return; photoId = null; $("#phmsg").textContent = "Uploading…";
    try {
      const bm = await createImageBitmap(f), k = Math.min(1, 4000 / Math.max(bm.width, bm.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(bm.width * k); cv.height = Math.round(bm.height * k);
      cv.getContext("2d").drawImage(bm, 0, 0, cv.width, cv.height);
      let blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.92));
      if (blob.size > 14e6) blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.8));
      const r = await fetch("/api/shop/upload", { method: "POST", headers: { "content-type": "image/jpeg" }, body: blob });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "The upload didn't work.");
      photoId = j.id; $("#phimg").src = j.url; $("#phimg").style.display = ""; $("#phph").style.display = "none";
      $("#phmsg").innerHTML = j.low_res ? `<span style="color:#b54708">This photo is ${j.w} × ${j.h}. It will print, but a larger photo will look sharper.</span>` : "Photo added.";
    } catch (e) { $("#phmsg").innerHTML = `<span class="err">${esc(e.message || "We couldn't read that photo. Try a JPEG or PNG.")}</span>`; }
  };
  if (text) {
    // Arriving from a store's "Personalize it" shelf: the store's example is filled in, ready to edit.
    renderFields(fromLink ? pre.getAll("f") : []);
    if ($("#dz")) $("#dz").onchange = () => { tpl = $("#dz").value; renderFields(); };
  }
  const body = () => ({ product_id: p.id, variant_id: Number($("#size").value), qty: Number($("#qty").value || 1),
    tpl: tpl || undefined, lines: text ? vals() : undefined, photo: photoId || undefined, gift_message: $("#gm").value,
    recipient: { name: $("#rn").value, address1: $("#ra").value, address2: $("#rb").value, city: $("#rc").value, state_code: $("#rs").value, zip: $("#rz").value, email: $("#re").value } });
  let qt = null;
  async function quote() {
    const b = body(); $("#err").textContent = "";
    if (!b.recipient.address1 || !b.recipient.city || !b.recipient.state_code || !/^\d{5}/.test(b.recipient.zip)) { $("#sum").innerHTML = `<span class="muted">Add the address to see shipping and the total.</span>`; return; }
    $("#sum").innerHTML = `<span class="muted">Getting shipping…</span>`;
    try { const j = await api("/quote", { method: "POST", body: JSON.stringify(b) });
      $("#sum").innerHTML = `Items: ${money(j.subtotal_cents)}<br>Shipping (${esc(j.rate.name)}): ${money(j.shipping_cents)}${j.tax_cents ? `<br>Sales tax (${esc(j.tax.state)}): ${money(j.tax_cents)}` : ""}<br><b>Total: ${money(j.total_cents)}</b>`; }
    catch (e) { $("#sum").innerHTML = ""; $("#err").textContent = e.message; }
  }
  ["#size", "#qty", "#ra", "#rc", "#rs", "#rz"].forEach(s => $(s).addEventListener("change", () => { clearTimeout(qt); qt = setTimeout(quote, 250); }));
  quote();
  $("#pay").onclick = async () => {
    $("#err").textContent = ""; if (photo && !photoId) { $("#err").textContent = "Add your photo."; return; } $("#pay").disabled = true; $("#pay").textContent = "Opening PayPal…";
    try { const j = await api("/checkout", { method: "POST", body: JSON.stringify(body()) }); location.href = j.url; }
    catch (e) { $("#err").textContent = e.message; $("#pay").disabled = false; $("#pay").textContent = "Pay with PayPal"; }
  };
}

async function thanks(id) {
  try { const o = await api("/orders/" + encodeURIComponent(id));
    const paid = o.status === "paid";
    $("#app").innerHTML = `<h2>${paid ? "Thank you! Your order is in." : o.status === "cancelled" ? "This order was cancelled." : "We're still waiting on the payment."}</h2>
    <p>${esc(o.title)}${o.variant_label ? " (" + esc(o.variant_label) + ")" : ""} × ${o.qty}${o.lines ? `<br>Your text: <b>${esc(o.lines.filter(Boolean).join(" / "))}</b>` : ""}</p>
    <p class="sum">Items: ${money(o.subtotal_cents)}<br>Shipping: ${money(o.shipping_cents)}${o.tax_cents ? `<br>Sales tax: ${money(o.tax_cents)}` : ""}<br><b>Total${paid ? " paid" : ""}: ${money(o.total_cents)}</b></p>
    ${paid ? `<p class="muted">${o.live ? "It goes to our print partner Printful now; your receipt is on its way by email." : "Test mode: the order was recorded but will not be printed or shipped."}</p>` : ""}
    <p class="muted small">Order number: ${esc(o.id)}</p><p><a href="/shop">Back to the shop</a></p>`;
  } catch (e) { $("#app").innerHTML = `<p class="err">We couldn't find that order.</p><p><a href="/shop">Back to the shop</a></p>`; }
}
start();
</script></body></html>
